[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nowertransfer"
# Read from the package, so the version lives in exactly one place.
dynamic = ["version"]
description = "One-click desktop client for sending files through your own croc relay."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nowenr" }]
keywords = ["croc", "file-transfer", "gui", "customtkinter", "self-hosted"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
]
# Floor is what the UI is actually developed and verified against, not
# the oldest release that might happen to work.
# tkinterdnd2 carries the tkdnd Tcl extension that lets the send screen
# take dropped files. The app runs without it; the drop zone then just
# asks for a click (see ui/dnd.py).
#
# Pillow backs CTkImage, which is what keeps the logo sharp on a
# scaled display; CustomTkinter 6 no longer pulls it in itself.
dependencies = ["customtkinter>=6.0", "tkinterdnd2>=0.4", "pillow>=10.0"]

# Development tools. A group rather than an optional extra: these are
# not something anyone installing the app should be offered, and `uv
# sync` picks the group up on its own, so the bootstrap stays one word.
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pyinstaller>=6.6", "poethepoet>=0.27"]

[project.urls]
Homepage = "https://github.com/Nowenr/NowerTransfer"
Source = "https://github.com/Nowenr/NowerTransfer"
Issues = "https://github.com/Nowenr/NowerTransfer/issues"

[project.gui-scripts]
nowertransfer = "nowertransfer.app:main"

[tool.hatch.version]
path = "src/nowertransfer/__init__.py"
pattern = '^VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/nowertransfer"]

# Every task a contributor needs. `poe` lists them with descriptions.
[tool.poe.tasks]
app = { cmd = "python -m nowertransfer", help = "Run the app from source" }
croc = { cmd = "python scripts/fetch_croc.py", help = "Download the croc binary" }
build = { cmd = "python scripts/build.py", help = "Build the executable into dist/" }
installer = { cmd = "python scripts/make_installer.py", help = "Build the Windows installer" }
test = { cmd = "pytest", help = "Run the test suite" }
lint = { cmd = "ruff check .", help = "Lint" }
fmt = { cmd = "ruff format .", help = "Format the code" }
"fmt:check" = { cmd = "ruff format --check .", help = "Fail if the code is unformatted" }
check = { sequence = ["lint", "fmt:check", "test"], help = "Everything CI runs" }
lock = { cmd = "uv lock", help = "Refresh uv.lock after changing dependencies" }
"lock:check" = { cmd = "uv lock --check", help = "Fail if uv.lock is out of date" }

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.per-file-ignores]
# The word list is hand-wrapped so it stays readable as a block.
"src/nowertransfer/codes.py" = ["E501"]
# Natural-language UI strings legitimately use typographic dashes, and
# the screens draw arrows and chevrons as text.
"src/nowertransfer/i18n.py" = ["RUF001"]
"src/nowertransfer/ui/views/*.py" = ["RUF001"]
# sys.path has to be prepared before the local imports.
"scripts/build.py" = ["E402"]
"scripts/make_installer.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
