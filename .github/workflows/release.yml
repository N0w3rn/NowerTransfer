name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: choco install innosetup --no-progress --yes

      # Executable and installer, through uv so both carry the locked
      # versions. No version argument - it comes from the tag.
      #
      # Deliberately without a relay: a published binary carrying relay
      # credentials hands every downloader the keys to it. Build locally
      # with a .env to give out a preconfigured copy.
      - run: uv run poe installer

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NowerTransfer.exe
            dist/NowerTransfer-*-setup.exe
          generate_release_notes: true
