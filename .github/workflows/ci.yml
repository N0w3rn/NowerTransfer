name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# `uv sync --locked` installs exactly what uv.lock says and fails if
# pyproject.toml has changed without the lock being refreshed. That is
# what stops the lockfile from quietly going stale, and it means CI runs
# against the same versions a developer does.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe lint
      - run: uv run poe fmt:check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # The widget tests have a job of their own, where a display exists.
      - run: uv run pytest --ignore=tests/test_ui_layout.py

  # The widget tests need a display. Both runners are tried on purpose:
  # Linux under xvfb is the reliable path, Windows matches the platform
  # the app actually ships on and has the font metrics that go with it.
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Turns "no display, skipping" into a failure. Without this the
      # job would pass by running nothing at all.
      NOWERTRANSFER_UI_TESTS: required
    steps:
      - uses: actions/checkout@v5
      # This job borrows its interpreter from setup-python. uv's own
      # CPython builds ship without tkinter on Linux, so `uv sync` alone
      # produces an environment that cannot open a window at all.
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"
      - name: Check the toolkit is really there
        run: >
          uv run --python "${{ steps.python.outputs.python-path }}"
          python -c "import tkinter, customtkinter; print('toolkit ok')"
      - if: runner.os == 'Linux'
        run: >
          xvfb-run --auto-servernum
          uv run --python "${{ steps.python.outputs.python-path }}"
          pytest tests/test_ui_layout.py -v
      - if: runner.os == 'Windows'
        run: >
          uv run --python "${{ steps.python.outputs.python-path }}"
          pytest tests/test_ui_layout.py -v

  build:
    runs-on: windows-latest
    needs: [lint, test, ui]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Run through uv so PyInstaller bundles the locked versions - it
      # packs whatever is installed in the environment it runs in.
      #
      # No relay is baked in: there is no .env in CI, and a public build
      # must not carry anyone's credentials. The version says plainly
      # that this is a CI artifact, not a release.
      - run: uv run poe build 0.0.0-ci
      - uses: actions/upload-artifact@v5
        with:
          name: NowerTransfer-windows
          path: dist/NowerTransfer.exe
          if-no-files-found: error
