name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      # The tests cover the logic, not the widgets, so the GUI
      # dependency is not needed here.
      - run: pytest

  build:
    runs-on: windows-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # This only checks that the build still works. No relay is baked
      # in - there is no .env in CI, and a public build must not carry
      # anyone's credentials - and the version says plainly that the
      # artifact is a CI build, not a release.
      - run: poe build 0.0.0-ci
      - uses: actions/upload-artifact@v5
        with:
          name: NowerTransfer-windows
          path: dist/NowerTransfer.exe
          if-no-files-found: error
